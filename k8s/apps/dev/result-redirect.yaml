apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-redirect
  namespace: vote-dev
spec:
  hostnames:
    - wtt-demo.syachin.de
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: Exact
            value: /result
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /result/
            statusCode: 301
