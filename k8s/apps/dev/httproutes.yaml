apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote
  namespace: vote-dev
spec:
  hostnames:
    - wtt-demo.syachin.de
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vote
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result
  namespace: vote-dev
spec:
  hostnames:
    - wtt-demo.syachin.de
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /result/socket.io
      backendRefs:
        - name: result
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /result
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: result
          port: 80
