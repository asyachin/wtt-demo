services:
  vote:
    image: "lilywalch/vote-image:latest"
    container_name: app-vote
    profiles: ["frontend"]
    ports:
      - "8080:80"
    environment:
      REDIS_HOST: "v2-lwinux-v2-ha-voting-app-redis-cluster.fcwbv3.0001.euc1.cache.amazonaws.com"
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  result:
    image: "lilywalch/result-image-original"
    container_name: app-result
    profiles: ["frontend"]
    ports:
      - "8081:80"
    environment:
      PG_HOST: "v2-lwinux-rds.cbamuw2quynv.eu-central-1.rds.amazonaws.com"
      PG_PORT: "5432"
      PG_USER: "postgres"
      PG_PASSWORD: "postgres"
      PG_DATABASE: "postgres"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PGSSLMODE: "require"
      PGHOST: "v2-lwinux-rds.cbamuw2quynv.eu-central-1.rds.amazonaws.com"  
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: 'postgres'
      PGDATABASE: "postgres"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  worker:
    image: "lilywalch/worker-image-original"
    container_name: app-worker
    profiles: ["worker"]
    environment:
    
      REDIS_HOST: "v2-lwinux-v2-ha-voting-app-redis-cluster.fcwbv3.0001.euc1.cache.amazonaws.com"
      REDIS_PORT: 6379
      
      DB_HOST: "v2-lwinux-rds.cbamuw2quynv.eu-central-1.rds.amazonaws.com"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "postgres"
      DB_SSLMODE: "Require"
      DB_SSL_TRUST: "true"
      

      PGSSLMODE: "require"
      PGHOST: "v2-lwinux-rds.cbamuw2quynv.eu-central-1.rds.amazonaws.com"
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: 'postgres'
      PGDATABASE: "postgres"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep worker || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    
 