[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests without external services",
    "integration: tests requiring external services",
    "e2e: end-to-end application tests",
    "platform: infrastructure and Kubernetes validation",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "app/result/views/angular.min.js",
    "app/result/views/socket.io.js",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
