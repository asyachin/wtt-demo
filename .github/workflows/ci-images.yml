
name: CI - Application Images

on:
  push:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest -q tests/unit

  node-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/result/package-lock.json
      - name: Install dependencies
        working-directory: app/result
        run: npm ci
      - name: Check Node.js syntax
        run: node --check app/result/server.js

  dotnet-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build Worker
        run: dotnet build app/worker/Worker.csproj -c Release

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.generate.outputs.image_tag }}
    steps:
      - name: Generate image version
        id: generate
        shell: bash
        run: |
          timestamp="$(date -u +'%Y.%m.%d-%H%M')"
          short_sha="${GITHUB_SHA:0:7}"
          image_tag="${timestamp}-build.${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}-${short_sha}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${image_tag}"

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [version, python-tests, node-check, dotnet-check]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: ./app/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/asyachin/wtt-demo/${{ matrix.service }}:${{ needs.version.outputs.image_tag }}
            ghcr.io/asyachin/wtt-demo/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/asyachin/wtt-demo

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/asyachin/wtt-demo/${{ matrix.service }}:${{ needs.version.outputs.image_tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Publish verified image
        shell: bash
        run: |
          docker push "ghcr.io/asyachin/wtt-demo/${{ matrix.service }}:${{ needs.version.outputs.image_tag }}"
          docker push "ghcr.io/asyachin/wtt-demo/${{ matrix.service }}:${{ github.sha }}"
